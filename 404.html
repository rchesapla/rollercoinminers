<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | RCHesapla</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .error-code {
            font-size: 80px;
            font-weight: 800;
            color: #f7931a; /* BTC Turuncu Vurgusu */
            line-height: 1;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .error-title {
            font-size: 24px;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 16px;
        }
        .error-desc {
            font-size: 15px;
            color: #8b949e;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #f7931a;
            color: #0d1117;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:hover {
            background-color: #e08213;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">Sayfa Bulunamadı</h1>
        <p class="error-desc">
            Aradığınız blok veya sayfa zincirde bulunamadı.<br>
            Bağlantı adresi değişmiş veya kaldırılmış olabilir.
        </p>
        <a href="https://rchesapla.github.io/" class="btn">Ana Sayfaya Dön</a>
    </div>
</body>
</html>
